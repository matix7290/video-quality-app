# Complete configuration. Replace /srv/video-quality-app and server_name for your host.
# Local preview: nginx -t -c /absolute/path/deploy/nginx.conf
# Public deployment: configure HTTPS as described in docs/deployment.en.md.
worker_processes auto;
pid /tmp/video-quality-nginx.pid;
error_log stderr warn;

events { worker_connections 2048; }

http {
    # Explicit MIME mappings keep this template independent of distro include paths.
    types { video/mp4 mp4; image/jpeg jpg jpeg; image/png png; image/webp webp; }
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    client_body_temp_path /tmp/video-quality-nginx-body;
    proxy_temp_path /tmp/video-quality-nginx-proxy;

    upstream study_app {
        server 127.0.0.1:3000;
        keepalive 128;
    }

    # Reject unrecognized Host headers instead of forwarding them to the local app.
    server { listen 127.0.0.1:8080 default_server; server_name _; return 404; }

    server {
        listen 127.0.0.1:8080;
        server_name localhost 127.0.0.1;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # Only original media files are public; no database/configuration directory.
        location ~* ^/(?:api/stimuli|videos)/([^/]+\.mp4)$ {
            alias /srv/video-quality-app/public/videos/$1;
            disable_symlinks on;
            max_ranges 1;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options nosniff always;
            limit_except GET { deny all; }
        }
        location ~* ^/(?:api/stimuli|images)/([^/]+\.(?:jpg|jpeg|png|webp))$ {
            alias /srv/video-quality-app/public/images/$1;
            disable_symlinks on;
            max_ranges 1;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options nosniff always;
            limit_except GET { deny all; }
        }

        location = /api/admin/upload {
            # Existing application limit: 2 GiB per video plus multipart overhead.
            client_max_body_size 2100m;
            client_body_timeout 900s;
            proxy_read_timeout 900s;
            proxy_request_buffering off;
            proxy_pass http://study_app;
        }
        location / {
            proxy_pass http://study_app;
        }
    }
}
