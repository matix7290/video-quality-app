# Install as /etc/nginx/conf.d/video-quality-app.conf after obtaining the certificate.
# Replace study.example.com everywhere. Keep the distro's main nginx.conf.
upstream video_quality_backend {
    server 127.0.0.1:3000;
    keepalive 128;
}

server {
    listen 80;
    listen [::]:80;
    server_name study.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://study.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name study.example.com;
    ssl_certificate /etc/letsencrypt/live/study.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/study.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != study.example.com) { return 404; }

    access_log /var/log/nginx/video-quality-app.access.log;
    error_log /var/log/nginx/video-quality-app.error.log warn;
    client_max_body_size 1m;
    keepalive_timeout 65;
    sendfile on;
    tcp_nopush on;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location ~* ^/(?:api/stimuli|videos)/([^/]+\.mp4)$ {
        alias /srv/video-quality-app/public/videos/$1;
        types { video/mp4 mp4; }
        default_type video/mp4;
        disable_symlinks on;
        max_ranges 1;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }
    location ~* ^/(?:api/stimuli|images)/([^/]+\.(?:jpg|jpeg|png|webp))$ {
        alias /srv/video-quality-app/public/images/$1;
        types { image/jpeg jpg jpeg; image/png png; image/webp webp; }
        disable_symlinks on;
        max_ranges 1;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
    }

    location = /api/admin/upload {
        client_max_body_size 2100m;
        client_body_timeout 900s;
        proxy_read_timeout 900s;
        proxy_request_buffering off;
        proxy_pass http://video_quality_backend;
    }
    location / { proxy_pass http://video_quality_backend; }
}
